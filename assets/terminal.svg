<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Courier New', 'Consolas', ui-monospace, monospace; font-size: 15px; }
    .p  { fill: #ff2a6d; font-weight: 700; }
    .c  { fill: #d1f7ff; }
    .k  { fill: #05d9e8; }
    .y  { fill: #f9f871; }
    .d  { fill: #9a8bc2; }
    .ok { fill: #39ff88; font-weight: 700; }
    .ln { opacity: 0; animation: show 16s steps(1) infinite; }
    .l1{animation-delay:.3s}.l2{animation-delay:1.1s}.l3{animation-delay:1.6s}.l4{animation-delay:2.1s}
    .l5{animation-delay:2.6s}.l6{animation-delay:3.4s}.l7{animation-delay:4.0s}.l8{animation-delay:4.6s}
    .l9{animation-delay:5.2s}.l10{animation-delay:6.0s}.l11{animation-delay:6.8s}
    @keyframes show { 0%{opacity:1} 92%{opacity:1} 93%,100%{opacity:0} }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{stroke-opacity:.45} 50%{stroke-opacity:1} }
  </style>

  <rect x="1" y="1" width="898" height="328" rx="10" fill="#0d0221"/>
  <rect class="glow" x="1" y="1" width="898" height="328" rx="10" fill="none" stroke="#05d9e8" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="34" rx="10" fill="#1a0b3a"/>
  <circle cx="24" cy="18" r="6" fill="#ff2a6d"/><circle cx="44" cy="18" r="6" fill="#f9f871"/><circle cx="64" cy="18" r="6" fill="#39ff88"/>
  <text x="450" y="23" text-anchor="middle" class="d" style="font-size:12px;letter-spacing:3px">dev@night-city ~ /boot</text>

  <text x="28" y="66"  class="ln l1"><tspan class="p">dev@night-city</tspan><tspan class="c">:~$ </tspan><tspan class="k">./whoami --verbose</tspan></text>
  <text x="28" y="94"  class="ln l2"><tspan class="d">[</tspan><tspan class="ok"> OK </tspan><tspan class="d">]</tspan><tspan class="c"> B.Tech CSE @ SRM IST, Vadapalani </tspan><tspan class="y">// CGPA 9.86 · Rank 1</tspan></text>
  <text x="28" y="118" class="ln l3"><tspan class="d">[</tspan><tspan class="ok"> OK </tspan><tspan class="d">]</tspan><tspan class="c"> 4 peer-reviewed papers loaded </tspan><tspan class="y">// ORION · ATLAS · CEREP · BioGPT-DDI</tspan></text>
  <text x="28" y="142" class="ln l4"><tspan class="d">[</tspan><tspan class="ok"> OK </tspan><tspan class="d">]</tspan><tspan class="c"> 3 internships mounted </tspan><tspan class="y">// Regacore · Airawat (IIT Kanpur CoE) · Sri Jayaram</tspan></text>
  <text x="28" y="166" class="ln l5"><tspan class="d">[</tspan><tspan class="ok"> OK </tspan><tspan class="d">]</tspan><tspan class="c"> languages </tspan><tspan class="y">// English · Hindi · Tamil</tspan></text>

  <text x="28" y="204" class="ln l6"><tspan class="p">dev@night-city</tspan><tspan class="c">:~$ </tspan><tspan class="k">cat ./directives.txt</tspan></text>
  <text x="28" y="230" class="ln l7"><tspan class="k">  ▸ </tspan><tspan class="c">I build systems, not isolated models.</tspan></text>
  <text x="28" y="252" class="ln l8"><tspan class="k">  ▸ </tspan><tspan class="c">Deterministic logic decides. The LLM explains.</tspan></text>
  <text x="28" y="274" class="ln l9"><tspan class="k">  ▸ </tspan><tspan class="c">If it isn't tested and benchmarked, it isn't done.</tspan></text>

  <text x="28" y="308" class="ln l10"><tspan class="p">dev@night-city</tspan><tspan class="c">:~$ </tspan><tspan class="k">status</tspan><tspan class="c">  → </tspan><tspan class="ok">OPEN TO AI/ML ROLES</tspan></text>
  <text x="28" y="308" class="ln l11" dx="0"><tspan dx="430" class="y cur">█</tspan></text>

  <rect width="900" height="330" rx="10" fill="url(#scan)"/>
</svg>

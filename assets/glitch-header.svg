<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.55" stop-color="#14052e"/>
      <stop offset="1" stop-color="#0a1a2f"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#05d9e8" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="sliceA"><rect x="0" y="60" width="900" height="18">
      <animate attributeName="y" values="60;120;88;140;70;60" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="18;6;24;10;14;18" dur="2.6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="sliceB"><rect x="0" y="130" width="900" height="10">
      <animate attributeName="y" values="130;80;150;100;130" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="10;20;8;16;10" dur="1.9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .name { font: 900 92px 'Courier New', 'Consolas', ui-monospace, monospace; letter-spacing: 10px; }
    .tag  { font: 700 15px 'Courier New', 'Consolas', ui-monospace, monospace; letter-spacing: 5px; }
    .mini { font: 600 11px 'Courier New', 'Consolas', ui-monospace, monospace; letter-spacing: 3px; }
    .cyan { animation: shiftC 2.6s steps(1) infinite; }
    .pink { animation: shiftP 1.9s steps(1) infinite; }
    .main { animation: flicker 5s linear infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .sweep { animation: sweep 4s linear infinite; }
    @keyframes shiftC { 0%{transform:translate(0,0)} 20%{transform:translate(-9px,0)} 35%{transform:translate(6px,0)} 55%{transform:translate(-3px,0)} 70%{transform:translate(12px,0)} 85%{transform:translate(0,0)} }
    @keyframes shiftP { 0%{transform:translate(0,0)} 15%{transform:translate(8px,0)} 40%{transform:translate(-11px,0)} 60%{transform:translate(4px,0)} 80%{transform:translate(-6px,0)} }
    @keyframes flicker { 0%,18%,22%,62%,64%,100%{opacity:1} 20%,63%{opacity:0.55} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes sweep { 0%{transform:translateY(-40px)} 100%{transform:translateY(300px)} }
  </style>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)"/>

  <!-- corner brackets -->
  <g stroke="#05d9e8" stroke-width="2" fill="none" opacity="0.8">
    <path d="M18 40V18H40"/><path d="M860 18H882V40"/>
    <path d="M18 220V242H40"/><path d="M860 242H882V220"/>
  </g>
  <text x="48" y="34" class="mini" fill="#05d9e8" opacity="0.75">SYS://TEKURU-ZENO</text>
  <text x="852" y="34" class="mini" fill="#ff2a6d" opacity="0.8" text-anchor="end">SIGNAL ▲ LIVE</text>

  <!-- glitch name: base + two chromatic layers clipped to moving slices -->
  <g class="main" filter="url(#neon)">
    <text x="450" y="140" text-anchor="middle" class="name" fill="#d1f7ff">DEV MEHTA</text>
  </g>
  <g clip-path="url(#sliceA)">
    <text x="450" y="140" text-anchor="middle" class="name cyan" fill="#05d9e8">DEV MEHTA</text>
  </g>
  <g clip-path="url(#sliceB)">
    <text x="450" y="140" text-anchor="middle" class="name pink" fill="#ff2a6d">DEV MEHTA</text>
  </g>

  <!-- neon rule -->
  <rect x="200" y="164" width="500" height="2" fill="#ff2a6d" opacity="0.9" filter="url(#neon)"/>
  <rect x="200" y="168" width="140" height="2" fill="#05d9e8"/>

  <text x="450" y="200" text-anchor="middle" class="tag" fill="#05d9e8">AI/ML ENGINEER // AGENTS · VOICE · RELIABILITY</text>
  <text x="450" y="226" text-anchor="middle" class="mini" fill="#9a8bc2">CHENNAI, IN · SRM IST · OPEN TO RELOCATION<tspan class="cursor" fill="#f9f871"> █</tspan></text>

  <!-- scanlines + moving sweep -->
  <rect width="900" height="260" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="900" height="30" fill="#05d9e8" opacity="0.05"/>
</svg>
